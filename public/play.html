<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18233a">
  <title>ゲームをよみこみ中 | ゲームのひろば</title>
  <meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./assets/audio-controls.css">
  <style>
    *{box-sizing:border-box}
    :root{--game-nav-height:calc(52px + env(safe-area-inset-top,0px))}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#18233a;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    #game-nav{position:fixed;top:0;left:0;right:0;height:var(--game-nav-height);padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:16px;z-index:25000;background:#18233a;border-bottom:1px solid #35415b}
    #home{display:inline-flex;align-items:center;justify-content:center;min-width:90px;min-height:42px;padding:7px 14px;background:#fff;color:#202641;border:0;border-radius:12px;font-size:15px;font-weight:900;text-decoration:none}
    #home:focus-visible{outline:3px solid #fcbf61;outline-offset:3px}
    #game-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:750;color:#e6eaf5}
    #game-frame{position:fixed;top:var(--game-nav-height);left:0;right:0;width:100%;height:calc(100% - var(--game-nav-height));height:calc(100dvh - var(--game-nav-height));border:0;background:#eef2ff}
    #message{position:fixed;top:var(--game-nav-height);bottom:0;left:0;right:0;display:grid;place-items:center;padding:25px;text-align:center;font-size:17px;font-weight:800;line-height:1.9}
    #message p{max-width:32rem}
    [hidden]{display:none!important}
    @media(max-height:450px){:root{--game-nav-height:calc(44px + env(safe-area-inset-top,0px))}#home{min-height:36px}}
    @media(max-width:360px){#game-nav{gap:8px}#home{min-width:80px;padding:6px 9px}}
  </style>
<script src="./assets/audio-settings.js"></script>
<script defer src="./assets/audio-controls.js"></script>
</head>
<body>
  <header id="game-nav">
    <a id="home" href="./" aria-label="ホームにもどる">← もどる</a>
    <span id="game-title" aria-live="polite">ゲームのひろば</span>
    <span class="audio-controls-root" data-audio-controls></span>
  </header>
  <div id="message" role="status"><p>ゲームをよみこんでいます…</p></div>
  <iframe id="game-frame" title="ミニゲーム" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const isWork = params.has('work') && !params.has('game');
    const id = params.get(isWork ? 'work' : 'game');
    const frame = document.querySelector('#game-frame');
    const message = document.querySelector('#message');
    try {
      if (!/^[a-z0-9-]+$/.test(id || '')) throw new Error('invalid game id');
      const response = await fetch('./games/catalog.json', { cache: 'no-cache' });
      if (!response.ok) throw new Error('catalog unavailable');
      const catalog = await response.json();
      const entries = isWork ? catalog.works : catalog.games;
      const item = entries?.find(entry => entry.id === id);
      const prefix = isWork ? 'works/' : 'games/';
      if (!item || item.status !== 'ready' ||
          item.path !== prefix + item.id + '/') throw new Error('entry unavailable');
      document.title = item.title + ' | ゲームのひろば';
      document.querySelector('#game-title').textContent = item.title;
      frame.title = item.title;
      frame.src = './' + item.path;
      frame.addEventListener('load', () => {
        frame.hidden = false;
        message.hidden = true;
      }, { once: true });
    } catch (error) {
      console.error('Game could not launch:', error);
      message.replaceChildren();
      const p = document.createElement('p');
      p.textContent = isWork ? 'この作品はまだみられません。ホームにもどってね。' : 'このゲームはまだあそべません。ゲームのひろばにもどってね。';
      message.append(p);
    }
  </script>
</body>
</html>
