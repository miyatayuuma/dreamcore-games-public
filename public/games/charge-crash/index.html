<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===== WebAudio SFX (no file I/O) ===== */
function initProcSFX(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain(); window.DreamcoreAudio.bindGain(master,ctx,'se',0.6); master.connect(ctx.destination);

  const activeCharges=new Set();
  function _stopAllCharges(fade=0.08){ activeCharges.forEach(h=>{ try{ h.stop(fade); }catch(_){} }); }

  document.addEventListener('visibilitychange',()=>{ if(document.hidden) _stopAllCharges(0.04); });
  window.addEventListener('pagehide',()=>_stopAllCharges(0.01));
  window.addEventListener('blur',()=>_stopAllCharges(0.04));
  try{ ctx.onstatechange=()=>{ if(ctx.state!=='running') _stopAllCharges(0.01); }; }catch(_){}

  const now = ()=>ctx.currentTime;
  const mkGain = (v=1)=>{ const g=ctx.createGain(); g.gain.value=v; g.connect(master); return g; };
  const mkLPF = (cut=20000)=>{ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.connect(master); return f; };
  const burstNoise=(dur=0.08,{gain=0.8,cut=4000}={})=>{
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain(); g.gain.setValueAtTime(gain,now()); g.gain.exponentialRampToValueAtTime(0.001,now()+dur*1.1);
    const f=mkLPF(cut); src.connect(g); g.connect(f);
    src.start(); src.stop(now()+dur*1.2);
  };
  const blip=({f=880,dur=0.09,type='square',gain=0.4}={})=>{
    const osc=ctx.createOscillator(); osc.type=type; osc.frequency.value=f;
    const g=ctx.createGain(); g.gain.setValueAtTime(gain,now()); g.gain.exponentialRampToValueAtTime(0.0008,now()+dur);
    osc.connect(g).connect(master); osc.start(); osc.stop(now()+dur+0.02);
  };

  function playChargeOneShot(opts={}){
    const {dur=0.28,gain=0.26,hp=140,lpfStart=6500,lpfEnd=600,sineStart=520,sineEnd=170}=opts;
    const t0=now(), tEnd=t0+Math.max(0.12,dur);

    const len=Math.ceil(ctx.sampleRate*(dur+0.05));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate); const ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*0.6;
    const nSrc=ctx.createBufferSource(); nSrc.buffer=buf; nSrc.loop=false;

    const hpF=ctx.createBiquadFilter(); hpF.type='highpass'; hpF.frequency.setValueAtTime(hp,t0);
    const lpF=ctx.createBiquadFilter(); lpF.type='lowpass';
    lpF.frequency.setValueAtTime(lpfStart,t0);
    lpF.frequency.exponentialRampToValueAtTime(Math.max(20,lpfEnd),tEnd-0.02);
    lpF.Q.setValueAtTime(0.7,t0);

    const gN=ctx.createGain();
    gN.gain.setValueAtTime(0.0001,t0);
    gN.gain.linearRampToValueAtTime(gain,t0+0.06);
    gN.gain.exponentialRampToValueAtTime(0.0001,tEnd);

    nSrc.connect(hpF).connect(lpF).connect(gN).connect(master);

    const sine=ctx.createOscillator(); sine.type='sine';
    sine.frequency.setValueAtTime(sineStart,t0);
    sine.frequency.exponentialRampToValueAtTime(Math.max(30,sineEnd),tEnd-0.02);

    const gS=ctx.createGain();
    gS.gain.setValueAtTime(0.0001,t0);
    gS.gain.linearRampToValueAtTime(gain*0.18,t0+0.04);
    gS.gain.exponentialRampToValueAtTime(0.0001,tEnd-0.01);

    const lpTone=ctx.createBiquadFilter(); lpTone.type='lowpass'; lpTone.frequency.setValueAtTime(900,t0); lpTone.Q.value=0.5;
    sine.connect(gS).connect(lpTone).connect(master);

    nSrc.start(t0); nSrc.stop(tEnd+0.01);
    sine.start(t0); sine.stop(tEnd+0.01);

    let cleaned=false;
    const tidy=()=>{
      if(cleaned) return; cleaned=true;
      try{ nSrc.disconnect(); hpF.disconnect(); lpF.disconnect(); gN.disconnect(); sine.disconnect(); gS.disconnect(); lpTone.disconnect(); }catch(_){}
      try{ activeCharges.delete(h); }catch(_){}
    };

    nSrc.onended=tidy; setTimeout(tidy,Math.ceil((dur+0.12)*1000));

    const h={ stop:(t=0.06)=>{
      const n=now();
      try{ gN.gain.cancelScheduledValues(n); gS.gain.cancelScheduledValues(n);
        gN.gain.setTargetAtTime(0.0001,n,Math.max(0.02,t*0.5));
        gS.gain.setTargetAtTime(0.0001,n,Math.max(0.02,t*0.5)); }catch(_){}
      try{ const endAt=n+Math.max(0.02,t); nSrc.stop(endAt); sine.stop(endAt); }catch(_){}
      setTimeout(tidy,Math.ceil((t+0.08)*1000));
    }};
    activeCharges.add(h);
    return h;
  }

  return {
    ctx,
    resume:()=>ctx.resume?.(),
    charge:(opt)=>playChargeOneShot(opt),
    fire:({rate=1.0}={})=>{ burstNoise(0.06,{gain:0.9,cut:6000}); blip({f:880*rate,dur:0.06,gain:0.35}); },
    hit:({power=1.0}={})=>{
      const t0=now();
      burstNoise(0.060,{gain:0.75*power,cut:4200});
      blip({f:1600,dur:0.020,type:'square',gain:0.18*power});
      const sub=ctx.createOscillator(); sub.type='sine';
      sub.frequency.setValueAtTime(140,t0); sub.frequency.exponentialRampToValueAtTime(60,t0+0.22);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.90*power,t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(420,t0); lp.Q.value=0.9;
      sub.connect(g).connect(lp).connect(master); sub.start(); sub.stop(t0+0.36); sub.onended=()=>{ try{ g.disconnect(); lp.disconnect(); }catch(_){} };
      const body=ctx.createOscillator(); body.type='triangle'; body.frequency.setValueAtTime(95,t0);
      const gb=ctx.createGain(); gb.gain.setValueAtTime(0.35*power,t0); gb.gain.exponentialRampToValueAtTime(0.0001,t0+0.12);
      body.connect(gb).connect(lp); body.start(); body.stop(t0+0.14); body.onended=()=>{ try{ gb.disconnect(); }catch(_){} };
    },
    deflect:()=>{ blip({f:1600,dur:0.10,type:'triangle',gain:0.28}); },
    reflect:()=>{ blip({f:1200,dur:0.12,type:'triangle',gain:0.26}); burstNoise(0.05,{gain:0.6,cut:7000}); },
    shieldBreak:()=>{ burstNoise(0.14,{gain:1.0,cut:1800}); blip({f:140,dur:0.18,type:'sine',gain:0.3}); },
    enemyDown:()=>{ burstNoise(0.16,{gain:0.9,cut:2600}); blip({f:420,dur:0.12,type:'square',gain:0.22}); },
    gameOver:()=>{ blip({f:300,dur:0.20,type:'sine',gain:0.25}); setTimeout(()=>blip({f:220,dur:0.24,type:'sine',gain:0.25}),120); },
    ui:{ overlay:()=>blip({f:660,dur:0.07,type:'square',gain:0.18}) },
    clap:({gain=0.22,spreadMs=18}={})=>{
      burstNoise(0.018,{gain:gain*1.2,cut:7800});
      setTimeout(()=>burstNoise(0.060,{gain:gain,cut:3600}),spreadMs);
      blip({f:1800,dur:0.020,type:'square',gain:gain*0.55});
    }
  };
}
window.SFX=initProcSFX();

/* =========================================================
   Visual/Hands/FX/Collision
   ========================================================= */
const rad=THREE.MathUtils.degToRad,deg=THREE.MathUtils.radToDeg,clamp=THREE.MathUtils.clamp;
const easeIO=(t)=>t*t*(3-2*t),DEFAULT_HOLD=0.6;

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(window.innerWidth,window.innerHeight);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0e1a);
scene.fog=new THREE.FogExp2(0x0b0e1a,0.005);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,2000);
camera.position.set(12,9,18); camera.lookAt(0,3,0);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;

scene.add(
  new THREE.HemisphereLight(0xdfe8ff,0x091018,0.9),
  (()=>{ const d=new THREE.DirectionalLight(0xffffff,0.65); d.position.set(8,12,8); return d; })()
);

const mTissue=new THREE.MeshStandardMaterial({color:0xe7d8c6,roughness:0.5,metalness:0.05,emissive:0xffd6b0,emissiveIntensity:0.35});

const cylY=(h,rt,rb,seg=28)=>new THREE.CylinderGeometry(rt,rb,h,seg,1,false);
const sph=(r=0.25,seg=28)=>new THREE.SphereGeometry(r,seg,seg);

function makeRoundedRectShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2,R=Math.min(r,Math.min(w,h)/2-0.01);
  s.moveTo(x+R,y);
  s.lineTo(x+w-R,y); s.quadraticCurveTo(x+w,y,x+w,y+R);
  s.lineTo(x+w,y+h-R); s.quadraticCurveTo(x+w,y+h,x+w-R,y+h);
  s.lineTo(x+R,y+h); s.quadraticCurveTo(x,y+h,x,y+h-R);
  s.lineTo(x,y+R); s.quadraticCurveTo(x,y,x+R,y);
  return s;
}
function buildPalmMesh(p){
  const geo=new THREE.ExtrudeGeometry(makeRoundedRectShape(p.W,p.D,p.R),{depth:p.T,bevelEnabled:true,bevelSegments:6,bevelSize:Math.min(p.R*0.6,Math.min(p.W,p.D)*0.12),bevelThickness:Math.min(p.T*0.6,0.6),curveSegments:64,steps:1});
  geo.center(); const m=new THREE.Mesh(geo,mTissue); m.rotation.x=Math.PI/2; return m;
}
const mirrorPalmParams=(p)=>({x:-p.x,y:p.y,z:p.z,yaw:-p.yaw,pitch:p.pitch,roll:-p.roll,W:p.W,D:p.D,T:p.T,R:p.R});

function createHand(side,parent){
  const isR=(side==='R');
  const root=new THREE.Group(); root.rotation.order='YXZ'; parent.add(root);

  const a={x:-0.3,y:1.7,z:0.0,yaw:-17,pitch:-86,roll:16,W:6.3,D:5.4,T:1.7,R:1.6};
  const b={x: 2.0,y:1.1,z:0.7,yaw: -1,pitch:-86,roll:-18,W:3.6,D:3.2,T:1.7,R:3.0};
  const ap=isR?mirrorPalmParams(a):a, bp=isR?mirrorPalmParams(b):b;

  const gA=new THREE.Group(); gA.rotation.set(rad(ap.pitch),rad(ap.yaw),rad(ap.roll),'YXZ'); gA.position.set(ap.x,ap.y,ap.z); gA.add(buildPalmMesh(ap)); root.add(gA);
  const gB=new THREE.Group(); gB.rotation.set(rad(bp.pitch),rad(bp.yaw),rad(bp.roll),'YXZ'); gB.position.set(bp.x,bp.y,bp.z); gB.add(buildPalmMesh(bp)); root.add(gB);

  const wristY=2.0,spread=1.55,startX=-spread*1.8;
  const xs=[startX+3*spread,startX+2*spread,startX+1*spread,startX+0*spread];
  const splay=[-5,0,5,10];
  const xL=isR?xs.map(v=>-v):xs.slice(), sp=isR?splay.map(v=>-v):splay.slice();
  function mc(x,len,radR,tilt,spDeg){
    const base=new THREE.Group(); base.position.set(x,wristY,-0.2); base.rotation.z=rad(spDeg); root.add(base);
    const shaft=new THREE.Mesh(cylY(len,radR,radR),mTissue); shaft.position.y=len*0.5; base.add(shaft);
    const distal=new THREE.Group(); distal.position.y=len; distal.rotation.x=rad(tilt); base.add(distal);
    return distal;
  }
  const mcIndex=mc(xL[0],2.1,0.27,7,sp[0]);
  const mcMiddle=mc(xL[1],2.2,0.28,6,sp[1]);
  const mcRing=mc(xL[2],2.1,0.26,7,sp[2]);
  const mcPinky=mc(xL[3],2.0,0.24,8,sp[3]);

  function seg(len,r0,r1){
    const g=new THREE.Group();
    const c=new THREE.Mesh(cylY(len,r1,r0,36),mTissue); c.position.y=len/2; g.add(c);
    const p=new THREE.Mesh(sph(r0,36),mTissue); p.scale.set(1,0.72,1); p.position.y=0;
    const d=new THREE.Mesh(sph(r1,36),mTissue); d.scale.set(1,0.72,1); d.position.y=len;
    g.add(p,d); return g;
  }
  const tip=(r)=>{ const m=new THREE.Mesh(sph(r,40),mTissue); m.scale.set(0.95,1.55,0.95); return m; };

  function finger(parent,lenArr,rBase,spreadDeg){
    const rf=new THREE.Group(); rf.rotation.z=rad(spreadDeg); parent.add(rf);
    const mcp=new THREE.Group(),pip=new THREE.Group(),dip=new THREE.Group(); rf.add(mcp);
    const r0=rBase,r1=rBase*0.9,r2=rBase*0.8,rt=rBase*0.75;
    const s0=seg(lenArr[0],r0,r1), s1=seg(lenArr[1],r1,r2), s2=seg(lenArr[2],r2,r2*0.95);
    mcp.add(s0); s0.add(pip); pip.position.y=lenArr[0];
    pip.add(s1); s1.add(dip); dip.position.y=lenArr[1];
    dip.add(s2); const tp=tip(rt); s2.add(tp); tp.position.y=lenArr[2];
    mcp.rotation.x=rad(-6); pip.rotation.x=rad(2); dip.rotation.x=rad(2);
    return { setCurl:(t)=>{ const a0=rad(70*t),a1=rad(95*t),a2=rad(65*t); mcp.rotation.x=a0; pip.rotation.x=a1; dip.rotation.x=a2; } };
  }
  const index =finger(mcIndex ,[2.9,2.0,1.45],0.934,isR? 4:-4);
  const middle=finger(mcMiddle,[3.1,2.1,1.5 ],0.966,0);
  const ring  =finger(mcRing  ,[2.8,1.95,1.35],0.903,isR?-4: 4);
  const pinky =finger(mcPinky ,[2.4,1.8,1.2 ],0.716,isR?-8: 8);

  const THUMB_SCALE=0.7, sgn=isR?-1:1;
  const baseT=new THREE.Group(); root.add(baseT);
  const yawN=new THREE.Group(), pitchN=new THREE.Group(), rollN=new THREE.Group();
  baseT.add(yawN); yawN.add(pitchN); pitchN.add(rollN);
  baseT.position.set(sgn*3.0,0.8,1.1);
  yawN.rotation.y=rad(sgn*133); pitchN.rotation.x=rad(60); rollN.rotation.z=rad(sgn*68);

  if(seg.dynamicHold&&!seg._resolved){ const elapsed=(performance.now()-st.seqStartMs)/1000; seg.dur=Math.max(0,DEFAULT_HOLD-elapsed); seg._resolved=true; }
  st.tSeg+=dt; const u=seg.dur>0?easeIO(Math.min(1,st.tSeg/seg.dur)):1;
  const LT=relToWorldForSide(mixTransform(seg.L0,seg.L1,u),side);
  const RT=relToWorldForSide(mixTransform(seg.R0,seg.R1,u),side);
  H.L.setWorldTransform(LT); H.R.setWorldTransform(RT);
  const gL0=gripsOf(seg.poseFromL||st.curPoseL), gL1=gripsOf(seg.poseToL||st.curPoseL);
  const gR0=gripsOf(seg.poseFromR||st.curPoseR), gR1=gripsOf(seg.poseToR||st.curPoseR);
  H.L.setGrips(mixGrips(gL0,gL1,u)); H.R.setGrips(mixGrips(gR0,gR1,u));
  if(st.tSeg>=seg.dur){ st.timeline.shift(); st.tSeg=0; if(seg.poseToL) st.curPoseL=seg.poseToL; if(seg.poseToR) st.curPoseR=seg.poseToR; }
  return true;
}

const shake={t:0,d:0,amp:0,active:false,baseCamPos:new THREE.Vector3(),baseTarget:new THREE.Vector3()};
const _shakeTmp=new THREE.Vector3();
function addShake(duration=0.4,amp=0.6,resetBase=false){
  if(!shake.active||resetBase){ shake.baseCamPos.copy(camera.position); if(controls&&controls.target) shake.baseTarget.copy(controls.target); else shake.baseTarget.set(0,0,0); }
  shake.t=0; shake.d=Math.max(0.0001,+duration); shake.amp=+amp; shake.active=true;
}
function stopShake(snap=true){

function updateShake(dt){
  if(!shake.active) return;
  shake.t+=Math.max(0,dt||0);
  const k=Math.max(0,1-shake.t/shake.d), s=shake.amp*k;
  _shakeTmp.set(Math.sin(17*shake.t)*s,Math.sin(23*shake.t+1.7)*s*1.1,Math.sin(19*shake.t+0.4)*s*0.9);

  if(shake.t>=shake.d){ camera.position.copy(shake.baseCamPos); if(controls&&controls.target) controls.target.copy(shake.baseTarget); shake.active=false; }
}

//#region effects-foundation
/* ===================== Registry / Timing / Collision ===================== */
const EFFECTS=new Set();
function registerEffect(effect,meta){
  effect.__alive=true; effect.meta=meta||{};
  const _dispose=effect.dispose, _kill=effect.kill;
  effect.kill=()=>{ effect.__alive=false; _kill&&_kill(); };
  effect.dispose=()=>{ try{ _dispose&&_dispose(); } finally{ EFFECTS.delete(effect); } };
  EFFECTS.add(effect); return effect;
}
function waitMs(ms){ return new Promise(r=>setTimeout(r,ms)); }
function updatePostImpactHoldUntil(targetMs){
  if(typeof game!=='object'||!game) return;
  const now=performance.now();
  game.impactHoldUntilMs=Math.max(game.impactHoldUntilMs||0,targetMs);
  const wait=Math.max(0,game.impactHoldUntilMs-now);
  game.postImpactHold=waitMs(wait);
}
function updatePostImpactHold(deltaMs=2000){ updatePostImpactHoldUntil(performance.now()+deltaMs); }

function handleCollisions(dt){
  const list=[...EFFECTS], now=performance.now();
  const attacks=list.filter(e=>e.__alive&&(e.meta?.type==='atk1'||e.meta?.type==='atk2')&&(!e.meta?.activeAt||now>=e.meta.activeAt));
  const shields=list.filter(e=>e.__alive&&e.meta?.type==='shield');
  const mirrors=list.filter(e=>e.__alive&&e.meta?.type==='shield_mirror');

  for(const sh of shields){
    const c=sh.meta.getCenterWorld(); const R=sh.meta.getRadius();
    for(const at of attacks){
      if(at.meta.side===sh.meta.side) continue;
      const tip=at.meta.getTipWorld?.(); if(!tip) continue;
      if(tip.distanceTo(c)<=R){
        if(at.meta.type==='atk1'){ sh.onDeflect?.(at); at.kill(); }
        else if(at.meta.type==='atk2'){ sh.onBreak?.(at); if(typeof game==='object'&&game) game.piercedThisTurn=true; }
      }
    }
  }

  for(const sh of mirrors){
    const plane=sh.meta.getPlane?.(); if(!plane) continue;
    for(const at of attacks){
      if(at.meta.side===sh.meta.side) continue;
      if(at.meta.reflectedOnce) continue;
      const O=at.meta.getOriginWorld?.(); if(!O) continue;
      const V=at.meta.getDirWorld?.();   if(!V) continue;
      const T=at.meta.getTipWorld?.();   if(!T) continue;

      const Vn=V.clone().normalize();
      const denom=plane.normal.dot(Vn); if(Math.abs(denom)<1e-4) continue;
      const s=plane.normal.dot(plane.point.clone().sub(O))/denom;
      if(s<0) continue;
      const lenNow=Math.max(0,Vn.dot(T.clone().sub(O)));
      if(s>lenNow+0.25) continue;

      const hit=O.clone().add(Vn.clone().multiplyScalar(s));
      const d=hit.clone().sub(plane.point);
      const U=plane.axisU.clone().normalize();
      const W=plane.axisV.clone().normalize();
      const u=d.dot(U), v=d.dot(W);
      let inside=true;
      if(plane.radius!=null) inside=(u*u+v*v)<=plane.radius*plane.radius;
      else if(plane.halfW!=null&&plane.halfH!=null) inside=(Math.abs(u)<=plane.halfW&&Math.abs(v)<=plane.halfH);
      if(!inside) continue;

      sh.onReflect?.(at,hit,plane.normal);
      at.reflect?.(hit,plane.normal,2.0,true);
    }
  }

  const eps=1e-4;
  for(let i=0;i<attacks.length;i++){
    const A=attacks[i];
    for(let j=i+1;j<attacks.length;j++){
      const B=attacks[j];
      if(A.meta.side===B.meta.side) continue;

      const O1=A.meta.getOriginWorld?.(), O2=B.meta.getOriginWorld?.();
      const T1=A.meta.getTipWorld?.(),    T2=B.meta.getTipWorld?.();
      if(!O1||!O2||!T1||!T2) continue;

      const C=new THREE.Vector3().addVectors(O1,O2).multiplyScalar(0.5);
      const d1=new THREE.Vector3().subVectors(T1,O1).normalize();
      const d2=new THREE.Vector3().subVectors(T2,O2).normalize();
      const L1=A.meta.getLength?A.meta.getLength():O1.distanceTo(T1);
      const L2=B.meta.getLength?B.meta.getLength():O2.distanceTo(T2);
      const t1c=Math.max(0,new THREE.Vector3().subVectors(C,O1).dot(d1));
      const t2c=Math.max(0,new THREE.Vector3().subVectors(C,O2).dot(d2));
      const A_reached=(L1+eps)>=t1c;
      const B_reached=(L2+eps)>=t2c;

      if(A.meta.type===B.meta.type){
        if(!(A_reached||B_reached)) continue;
        A.meta.stopAtLen?.(t1c); B.meta.stopAtLen?.(t2c);
        const col=(A.meta.type==='atk1')?0x9fdfff:0xffd090;
        spawnBeamClashExplosion(C,col); A.kill(); B.kill(); continue;
      }

      const A_isAtk2=(A.meta.type==='atk2');
      const atk2=A_isAtk2?A:B, atk1=A_isAtk2?B:A;
      const atk2Reached=A_isAtk2?A_reached:B_reached;
      const tAtk1Center=A_isAtk2?t2c:t1c;

      if(atk2Reached){
        atk1.meta.stopAtLen?.(tAtk1Center);
        spawnDissipateFlash(C,0x9fdfff);
        atk1.kill();
        if(typeof game==='object'&&game) game.piercedThisTurn=true;
      }
    }
  }
}

  let age=0, phase='charge', L=0.01, Lmax=160, grow=140, alive=true;

  const eff=registerEffect(pushEffect({
    update(dt){

        const tangent=new THREE.Vector3(-toCenter.z,0,toCenter.x).normalize();
        o.s.position.addScaledVector(toCenter,o.spdIn*dt);
        o.s.position.addScaledVector(tangent,o.swirl*dt);
        const d=o.s.position.length();
        const a=THREE.MathUtils.clamp((12-d)/12,0,1);
        o.s.material.opacity=a*0.9;
        const sc=0.25+0.6*(1-d/12); o.s.scale.set(sc,sc,1);
        if(d<0.35){ const R=8+Math.random()*6, dir=new THREE.Vector3().randomDirection(); o.s.position.copy(dir.multiplyScalar(R)); }
      });

      function updateStream(st){
        st.arr.forEach(p=>{
          p.t+=dt*p.speed; if(p.t>=1){ p.t=Math.random()*0.25; }
          const pos=p.start.clone().addScaledVector(p.v,p.t*p.len);
          const local=g.worldToLocal(pos.clone());
          p.spr.position.copy(local);
          p.spr.material.opacity=THREE.MathUtils.smoothstep(1-p.t,0.0,1.0)*0.9;
          const sc=0.20+0.35*(1-p.t); p.spr.scale.set(sc,sc,1);
        });
      }
      updateStream(streamL); updateStream(streamR);

      if(tAll>LIFE){
        const k=Math.max(0,1-(tAll-LIFE)/0.5);
        core.material.opacity*=k; shell.material.opacity*=k; light.intensity*=k;
        orbitGroup.children.forEach(s=> s.material.opacity*=k);
        streamL.arr.forEach(p=> p.spr.material.opacity*=k);
        streamR.arr.forEach(p=> p.spr.material.opacity*=k);
        if(k<=0.02) alive=false;
      }
      return true;
    },
    dispose(){
      scene.remove(g);
      shell.geometry.dispose(); shell.material.dispose();
      core.material.dispose();
      orbitGroup.children.forEach(s=> s.material.dispose());
      streamL.arr.forEach(p=> p.spr.material.dispose());
      streamR.arr.forEach(p=> p.spr.material.dispose());
    }
  }),{type:'charge',side});
}

// 予測
function _predictNext_simple(hist,win){
  win=win||4;
  var h=Array.isArray(hist)?hist.slice(-Math.max(2,win)):[];
  if(h.length<2) return null;
  var pair={},best=null,sc=-1,lastPrev=h[h.length-1],map;
  for(var i=0;i<h.length-1;i++){
    var prev=h[i],next=h[i+1];
    if(!pair[prev]) pair[prev]={};
    pair[prev][next]=(pair[prev][next]||0)+1;
  }
  map=pair[lastPrev]||{};
  for(var k in map){ if(map[k]>sc){ sc=map[k]; best=k; } }
  return best;
}
function _predictNext_strong(hist,win){ return _predictNext_simple(hist,win||6); }

var AI_TUNING={

  4:{allow:{R:true,S:true},  energyCap:5,memory:4,base:{e0:{C:.50,B:.30,A:.20},e1:{C:.22,B:.18,A:.32,R:.28},e2plus:{C:.18,B:.16,A:.32,R:.16,S:.18}},cd:{R:2,S:2},noise:0.04},
  5:{allow:{R:true,S:true},  energyCap:5,memory:5,base:{e0:{C:.46,B:.32,A:.22},e1:{C:.18,B:.16,A:.36,R:.30},e2plus:{C:.16,B:.14,A:.34,R:.18,S:.18}},cd:{R:1,S:2},noise:0.05},
  6:{allow:{R:true,S:true},  energyCap:5,memory:6,base:{e0:{C:.42,B:.34,A:.24},e1:{C:.14,B:.14,A:.32,R:.40},e2plus:{C:.12,B:.12,A:.30,R:.22,S:.24}},cd:{R:1,S:1},noise:0.08}
};

function _recent(arr,n){ return arr.slice(-Math.max(0,n)); }
function _cnt(arr,pred){ var a=0; for(var i=0;i<arr.length;i++){ if(pred(arr[i])) a++; } return a; }
function _add(w,k,v){ if(v>0){ w[k]=(w[k]||0)+v; } }
function _decay(x){ return Math.max(0,x-1); }
function _normWeights(w){ var s=0,o={}; for(var k in w){ s+=Math.max(0,w[k]||0); } if(s<=0) return {}; for(var k2 in w){ o[k2]=Math.max(0,w[k2]||0)/s; } return o; }
function _pick(w){ var r=Math.random(),acc=0; for(var k in w){ acc+=w[k]; if(r<=acc) return k; } return Object.keys(w)[0]||ACT.C; }

function chooseAI(turn,eAI,ePL,histPL,locked){
  if(locked&&locked.use){ var lockMap={atk1:ACT.A,atk2:ACT.S,def1:ACT.B,def2:ACT.R,charge:ACT.C}; if(lockMap[locked.value]) return lockMap[locked.value]; }
  var lvl=level(),T=AI_TUNING[lvl]||AI_TUNING[1];
  game.aiCD=game.aiCD||{R:0,S:0}; game.aiCD.R=_decay(game.aiCD.R); game.aiCD.S=_decay(game.aiCD.S);
  var cap=T.energyCap|0, eEff=Math.min(eAI|0,cap|0);
  if((eEff|0)===0&&(ePL|0)===0) return ACT.C;
  if((ePL|0)===0) return (eEff>=1)?ACT.A:ACT.C;

  var pred=null;
  if(lvl>=5){
    pred=(lvl>=6)?_predictNext_strong(histPL,6):_predictNext_simple(histPL,4);
    var canR=!(T.allow.R===false)&&eEff>=1&&(game.aiCD.R|0)===0;
    var canS=!(T.allow.S===false)&&eEff>=2&&(game.aiCD.S|0)===0;
    if((pred===ACT.A||pred===ACT.S)&&canR) return ACT.R;
    if(pred===ACT.B&&canS) return ACT.S;
  }

  var canA=eEff>=1, canR2=!(T.allow.R===false)&&eEff>=1&&(game.aiCD.R|0)===0, canS2=!(T.allow.S===false)&&eEff>=2&&(game.aiCD.S|0)===0;
  var base=(eEff===0)?T.base.e0:(eEff===1?T.base.e1:T.base.e2plus), W={};
  if(base.C) W.C=base.C; if(base.B) W.B=base.B; if(canA&&base.A) W.A=base.A; if(canR2&&base.R) W.R=base.R; if(canS2&&base.S) W.S=base.S;
  if(eEff>=cap) W.C=0;

  var mem=Math.max(1,T.memory|0), recent=_recent(histPL,mem);
  var cntAS=_cnt(recent,function(x){return x===ACT.A||x===ACT.S;});
  var cntB=_cnt(recent,function(x){return x===ACT.B;});
  var cntC=_cnt(recent,function(x){return x===ACT.C;});
  var cntR2=_cnt(_recent(histPL,2),function(x){return x===ACT.R;});

  if(cntC>=2&&canA) _add(W,ACT.A,0.25);
  if(cntB>=2&&canS2) _add(W,ACT.S,0.25);
  if(lvl>=3&&cntAS>=2&&canR2) _add(W,ACT.R,0.25);
  if(lvl>=3&&cntR2>=1){ _add(W,ACT.C,0.15); _add(W,ACT.B,0.10); }
  if(lvl>=4&&(ePL|0)>=1&&eEff===0) _add(W,ACT.B,0.25);

  if(lvl>=4&&recent.length>=2){
    var last=recent[recent.length-1],prev=recent[recent.length-2];
    if(last===prev){
      if((last===ACT.A||last===ACT.S)&&canR2) _add(W,ACT.R,0.20);
      if(last===ACT.B&&canS2) _add(W,ACT.S,0.20);
      if(last===ACT.C&&canA)  _add(W,ACT.A,0.20);
    }
  }

  if(lvl>=5){
    if(!pred) pred=(lvl>=6)?_predictNext_strong(histPL,6):_predictNext_simple(histPL,4);
    var canR3=canR2, canS3=canS2;
    if((pred===ACT.A||pred===ACT.S)&&canR3) _add(W,ACT.R,0.25);
    if(pred===ACT.B&&canS3) _add(W,ACT.S,0.20);
    if((pred===ACT.C||pred===ACT.Idle)&&canA) _add(W,ACT.A,0.25);
  }

  var noise=T.noise||0;
  Object.keys(W).forEach(function(k){
    if(W[k]>0){ var f=1+(Math.random()*2-1)*noise; W[k]*=Math.max(0.5,Math.min(1.5,f)); }
  });

  if(!canR2) W.R=0; if(!canS2) W.S=0; if(!canA) W.A=0; if(eEff>=cap) W.C=0;
  var NW=_normWeights(W), has=Object.keys(NW).length>0;
  return has?_pick(NW):((eEff>=2&&(game.aiCD.S|0)===0)?ACT.S:(eEff>=1?ACT.A:ACT.B));
}

function playClap2Side(side,totalSec){
  var H=handsOf(side);
  var L0=worldToRelForSide(H.L.getWorldTransform(),side);
  var R0=worldToRelForSide(H.R.getWorldTransform(),side);
  var Hsc=SC('home'),C=SC('clap');
  var T=(totalSec!=null)?Math.max(0.2,totalSec):1.20;
  var r={settle1:0.10,toC1:0.22,back1:0.18,toC2:0.22,back2:0.18,settle2:0.10};
  playSequenceSide(side,[
    {L0:L0,R0:R0,L1:Hsc.leftT,R1:Hsc.rightT,dur:T*r.settle1,poseFromL:state[side].curPoseL,poseToL:Hsc.pose,poseFromR:state[side].curPoseR,poseToR:Hsc.pose},
    {L0:Hsc.leftT,R0:Hsc.rightT,L1:C.leftT,R1:C.rightT,dur:T*r.toC1,poseFromL:Hsc.pose,poseToL:C.pose,poseFromR:Hsc.pose,poseToR:C.pose},
    {L0:C.leftT,R0:C.rightT,L1:Hsc.leftT,R1:Hsc.rightT,dur:T*r.back1,poseFromL:C.pose,poseToL:Hsc.pose,poseFromR:C.pose,poseToR:Hsc.pose},
    {L0:Hsc.leftT,R0:Hsc.rightT,L1:C.leftT,R1:C.rightT,dur:T*r.toC2,poseFromL:Hsc.pose,poseToL:C.pose,poseFromR:Hsc.pose,poseToR:C.pose},
    {L0:C.leftT,R0:C.rightT,L1:Hsc.leftT,R1:Hsc.rightT,dur:T*r.back2,poseFromL:C.pose,poseToL:Hsc.pose,poseFromR:C.pose,poseToR:Hsc.pose},
    {L0:Hsc.leftT,R0:Hsc.rightT,L1:Hsc.leftT,R1:Hsc.rightT,dur:T*r.settle2,poseFromL:Hsc.pose,poseToL:Hsc.pose,poseFromR:Hsc.pose,poseToR:Hsc.pose}
  ]);
}

function playToSceneHoldThenHome_side(side,key,approach,back,onArrive,startEarlySec){
  approach=(typeof approach==='number')?Math.max(0.05,approach):0.7;
  startEarlySec=startEarlySec||0;
  var H=handsOf(side);
  var Lnow=worldToRelForSide(H.L.getWorldTransform(),side);
  var Rnow=worldToRelForSide(H.R.getWorldTransform(),side);

  playSequenceSide(side,[{L0:Lnow,R0:Rnow,L1:S.leftT,R1:S.rightT,dur:approach,poseFromL:state[side].curPoseL,poseToL:S.pose,poseFromR:state[side].curPoseR,poseToR:S.pose}]);
  if(onArrive){
    var delaySec=Math.max(0,approach+startEarlySec);

function playToSceneOnBeat_side(side,key,totalSec,split,onArrive,spawnAtMs){
  split=split||{approach:0.45};
  var A=Math.max(0.0,Math.min(1.0,split.approach||0.45));
  var approachSec=Math.max(0.05,(totalSec||0.6)*A);
  var H=handsOf(side);
  var Lnow=worldToRelForSide(H.L.getWorldTransform(),side);
  var Rnow=worldToRelForSide(H.R.getWorldTransform(),side);
  var S=SC(key||'home');
  playSequenceSide(side,[{L0:Lnow,R0:Rnow,L1:S.leftT,R1:S.rightT,dur:approachSec,poseFromL:state[side].curPoseL,poseToL:S.pose,poseFromR:state[side].curPoseR,poseToR:S.pose}]);
  if(onArrive){
    var now=performance.now();
    var delay=(spawnAtMs!=null)?Math.max(0,spawnAtMs-now):Math.max(0,approachSec*1000*0.9);
    var id=setTimeout(function(){ onArrive(side); },delay);
    if(state&&state[side]&&state[side].timers) state[side].timers.push(id);

function moveHome(side,durSec){
  var H=handsOf(side);
  var Lnow=worldToRelForSide(H.L.getWorldTransform(),side);

var ATK_CONST={A:{charge:0.55,grow:140,spawnDelay:1.1},S:{charge:0.15,grow:180,spawnDelay:1.2}};
function _estimateAlongDistance(attackerSide,targetSide,toMirror){
  var H=handsOf(attackerSide), TL=H.L.getWorldTransform(), TR=H.R.getWorldTransform();
  var origin=new THREE.Vector3((TL.x+TR.x)/2,(TL.y+TR.y)/2,(TL.z+TR.z)/2);
  var base=(attackerSide==='player')?baseO:baseP;
  var dir=new THREE.Vector3(base.x-origin.x,0,base.z-origin.z).normalize();
  var Ho=handsOf(targetSide), TLo=Ho.L.getWorldTransform(), TRo=Ho.R.getWorldTransform();
  var mid=new THREE.Vector3((TLo.x+TRo.x)/2,(TLo.y+TRo.y)/2,(TLo.z+TRo.z)/2);
  var target=toMirror?mid.clone().add(dir.clone().multiplyScalar(5)).add(new THREE.Vector3(0,7,0)):mid;
  var along=Math.max(0,dir.dot(target.clone().sub(origin)));
  return {along:along,dir:dir,origin:origin};
}
function scheduleImpact(victimSide,attackerSide,act,reflected){
  var C=ATK_CONST[act];
  if(!C){
    var when=300;
    if(typeof updatePostImpactHoldUntil==='function') updatePostImpactHoldUntil(performance.now()+when+2000);
    var id0=setTimeout(function(){
      if(typeof spawnHitExplosionAtHand==='function') spawnHitExplosionAtHand(victimSide);
      if(typeof updatePostImpactHold==='function') updatePostImpactHold(2000);
    },when);
    if(state&&state[victimSide]&&state[victimSide].timers) state[victimSide].timers.push(id0);
    return;
  }
  var tgtSideForForward=otherSide(attackerSide);
  var info=_estimateAlongDistance(attackerSide,tgtSideForForward,reflected);
  var along=info.along;
  var forwardMs=(C.spawnDelay+C.charge+(along/C.grow))*1000;
  var returnMs=reflected?((along/C.grow)*1000)-550:0;
  var totalMs=Math.max(0,forwardMs+returnMs-650);

  if(typeof updatePostImpactHoldUntil==='function') updatePostImpactHoldUntil(performance.now()+totalMs+2000);
  var id=setTimeout(function(){
    if(typeof spawnHitExplosionAtHand==='function') spawnHitExplosionAtHand(victimSide);
    if(window.SFX&&SFX.hit) SFX.hit();
    if(typeof updatePostImpactHold==='function') updatePostImpactHold(2000);
  },totalMs);
  if(state&&state[victimSide]&&state[victimSide].timers) state[victimSide].timers.push(id);
}

function resolvePairV3(a,b){
  var r=resolvePairV3_core(a,b);
  if(r.self){
    if(b===ACT.A)               scheduleImpact('player','opponent','A',false);
    else if(b===ACT.S)          scheduleImpact('player','opponent','S',false);
    else if(a===ACT.A&&b===ACT.R) scheduleImpact('player','player','A',true);
    else if(a===ACT.S&&b===ACT.R) scheduleImpact('player','player','S',true);
    else                         scheduleImpact('player','opponent','A',false);
  }
  if(r.opp){
    if(a===ACT.A)               scheduleImpact('opponent','player','A',false);
    else if(a===ACT.S)          scheduleImpact('opponent','player','S',false);
    else if(b===ACT.A&&a===ACT.R) scheduleImpact('opponent','opponent','A',true);
    else if(b===ACT.S&&a===ACT.R) scheduleImpact('opponent','opponent','S',true);
    else                         scheduleImpact('opponent','player','A',false);
  }
  return r;
}

function perform(side,act){
  var key=KEYS[act]||'home', onArrive=spawnerOf(act);
  if(act===ACT.S) playToSceneHoldThenHome_side(side,key,0.8,0.8,onArrive);
  else if(act===ACT.C) playToSceneHoldThenHome_side(side,key,0.7,0.7,onArrive,-0.35);
  else if(act===ACT.Idle) playToSceneHoldThenHome_side(side,'home',0.3,0.3,null);
  else playToSceneHoldThenHome_side(side,key,0.7,0.7,onArrive);
}

/* =========================================================
 *  BEAT CONDUCTOR (4拍：0-1手拍子 / 2-3モーション)
 * =======================================================*/
//#region beat
var BEATS_PER_TURN=4,CLAP_BEATS=2,MOTION_BEATS=2,beatRAF=null;
function _ensureRhythm(){ if(!game)return; const L=BEATS_PER_TURN|0,ms=Math.max(1,Math.floor(60000/(game.bpm||100))); if(!Array.isArray(game.rhythmMs)||game.rhythmMs.length!==L){ game.rhythmMs=Array(L).fill(ms); } }
function getBeatDurMs(idx){ if(!game)return 500; _ensureRhythm(); const L=game.rhythmMs.length; return Math.max(30,game.rhythmMs[((idx%L)+L)%L]|0); }
function sumBeats(fromIdxInTurn,count){ _ensureRhythm(); let s=0; for(let i=0;i<count;i++){ s+=getBeatDurMs((fromIdxInTurn+i)%BEATS_PER_TURN); } return s; }
window.setRhythmBySec=function(arr){ if(!Array.isArray(arr)||arr.length!==BEATS_PER_TURN)return; if(!game)return; game.rhythmMs=arr.map(x=>Math.max(0.03,+x)*1000); };
window.setRhythmByMs=function(arr){ if(!Array.isArray(arr)||arr.length!==BEATS_PER_TURN)return; if(!game)return; game.rhythmMs=arr.map(x=>Math.max(30,(+x|0))); };

function startBeatConductor(){
  if(!game)return; if(beatRAF) cancelAnimationFrame(beatRAF);
  _ensureRhythm();
  const now=performance.now();
  game.baseStartMs=now; game.turnStartMs=now; game.currBeatStartMs=now; game.beatCursor=0; game.pendingRes=null;
  onBeat(0);
  game.nextBeatAt=now+getBeatDurMs(0);
  function loop(){
    if(!game||!game.running){ beatRAF=null; return; }
    const t=performance.now();
    while(t>=game.nextBeatAt){
      const boundary=game.nextBeatAt;
      game.beatCursor+=1; game.currBeatStartMs=boundary;
      const beatInTurn=game.beatCursor%BEATS_PER_TURN;
      if(beatInTurn===0) game.turnStartMs=boundary;
      onBeat(game.beatCursor);
      game.nextBeatAt=boundary+getBeatDurMs(beatInTurn);
    }
    beatRAF=requestAnimationFrame(loop);
  }
  loop();
}
function stopBeatConductor(){ if(beatRAF){ cancelAnimationFrame(beatRAF); beatRAF=null; } }

function onBeat(bi){
  window.setRhythmBySec([0.6,0.6,0.4,0.4]);
  if(!game||!game.running)return;
  var beatInTurn=bi%BEATS_PER_TURN,isPractice=!!(game&&game.mode==='practice');

  if(beatInTurn===0){
    game.piercedThisTurn=false;
    var clapMs=sumBeats(0,CLAP_BEATS),clapSec=clapMs/1000;
    playerChoice=null;
    game.inputOpenSince=performance.now(); game.inputClosesAt=game.turnStartMs+clapMs;
    playClap2Side('player',clapSec); playClap2Side('opponent',clapSec);
    if(window.SFX&&SFX.clap){
      const t1=(0.10+0.22)*clapMs,t2=(0.10+0.22+0.18+0.22)*clapMs;
      const id1=setTimeout(()=>SFX.clap({gain:0.22}),t1);
      const id2=setTimeout(()=>SFX.clap({gain:0.22}),Math.min(t2,clapMs-10));
      try{ state?.player?.timers?.push(id1,id2); state?.opponent?.timers?.push(id1,id2); }catch(_){}
      centerIcon.enable(true);
    }
    game.inputOpen=true; return;
  }

  if(beatInTurn===2){
    game.inputOpen=false; centerIcon.enable(false);
    (function(){
      const st=window._swipeState||{},openSince=game.inputOpenSince||game.turnStartMs||0;
      if(st.lastAct&&st.lastActTime&&st.lastActTime>=openSince) playerChoice=st.lastAct;
    })();
    var chosenP=(playerChoice!=null)?playerChoice:ACT.Idle;
    var aiLocked=enemyFixed?{use:true,value:(ui.enemyBehavior&&ui.enemyBehavior.value)}:{use:false};
    var chosenO=chooseAI(game.turn,game.eO,game.eP,game.histP,aiLocked);
    var aP=validateAction(chosenP,game.eP),aO=enemyFixed?chosenO:validateAction(chosenO,game.eO);

    var eP=game.eP,eO=game.eO,lvl=level(),cap=(AI_TUNING[lvl]||AI_TUNING[1]).energyCap;
    if(aP===ACT.C) eP=clampE(eP+1);
    if(aO===ACT.C) eO=Math.min(cap,clampE(eO+1));
    if(aP===ACT.A||aP===ACT.R) eP=clampE(eP-1);
    if(aP===ACT.S) eP=clampE(eP-2);
    if(aO===ACT.A||aO===ACT.R) eO=Math.max(0,eO-1);
    if(aO===ACT.S) eO=Math.max(0,eO-2);
    eO=Math.min(cap,eO);
    game.eP=eP; game.eO=eO; updateBars();
    if(aO===ACT.R) game.aiCD.R=(AI_TUNING[lvl].cd.R|0);
    if(aO===ACT.S) game.aiCD.S=(AI_TUNING[lvl].cd.S|0);

    var motionMs=sumBeats(2,MOTION_BEATS),motionSec=motionMs/1000,motionStartMs=game.turnStartMs+sumBeats(0,CLAP_BEATS),spawnAtMs=motionStartMs+motionSec*0.45*1000,split={approach:0.45,hold:0.10,back:0.45};
    playToSceneOnBeat_side('player',KEYS[aP]||'home',motionSec,split,spawnerOf(aP),spawnAtMs);
    playToSceneOnBeat_side('opponent',KEYS[aO]||'home',motionSec,split,spawnerOf(aO),spawnAtMs);

    game.pendingRes=resolvePairV3(aP,aO);
    console.log('[TURN '+game.turn+'] P:'+aP+' vs O:'+aO+' -> hit{opp:'+game.pendingRes.opp+', self:'+game.pendingRes.self+'} eP:'+game.eP+' eO:'+game.eO);
    game.histP.push(aP); if(game.histP.length>20) game.histP.shift();
    game.histO.push(aO); if(game.histO.length>20) game.histO.shift();
    return;
  }

  if(beatInTurn===3){
    if(game.pendingRes){
      var opp=game.pendingRes.opp,self=game.pendingRes.self;
      if(isPractice){ game.pendingRes=null; }
      else{
        if(self){
          updateBars(); game.running=false; stopBeatConductor(); game.pendingRes=null; showOverlayResult('lose'); return;
        }
        if(opp){
          game.eP=0; game.eO=0; game.histP=[]; game.histO=[]; updateBars(); game.running=false; stopBeatConductor(); game.pendingRes=null;
          if(game.kills>=(campaign.maxLevel||6)) showOverlayResult('clear'); else showOverlayResult('win'); return;
        }
        game.pendingRes=null;
      }
    }
    game.turn++; if(ui.lockMsg) ui.lockMsg.textContent='（手拍子へ）'; return;
  }
}

          ui.ov.classList.remove('show');
          if(typeof setSwipeEnabled==='function') setSwipeEnabled(true);
          game.running=true; game.turn=1; game.baseStartMs=performance.now(); game.lastBeatIdx=-1; startBeatConductor();
        };
        game.postImpactHold=null; game.impactHoldUntilMs=0;
      },1500);
    }else{
      ui.ovFace.classList.remove('defeated');
      ui.ovTitle.textContent='DEFEATED';
      ui.ovSub.textContent='RETRY: LEVEL '+game.level+'  '+new Array(game.level+1).join('★');
      ui.ovPrimary.textContent='もう一度';
      ui.ovPrimary.style.display='';
      ui.ovPrimary.onclick=function(){
        stopBeatConductor();
        game.eP=0; game.eO=0; game.histP=[]; game.histO=[]; game.aiCD={R:0,S:0};
        ui.ov.classList.remove('show');
        if(typeof setSwipeEnabled==='function') setSwipeEnabled(true);
        game.running=true; game.turn=1; game.baseStartMs=performance.now(); game.lastBeatIdx=-1; startBeatConductor();
      };
      game.postImpactHold=null; game.impactHoldUntilMs=0;
    }
  }
  var wait=game&&game.postImpactHold;
  if(wait&&typeof wait.then==='function'){ Promise.resolve(wait).then(proceed); } else { proceed(); }
}
//#endregion overlays

/* =========================================================
 *  GAME START / STOP（対戦／練習モード切替）
 * =======================================================*/
//#region start-stop
(function(){
  // 1) 顔適用（DOMカード＋3Dスプライト）— 既存が無ければ定義
  if(typeof window.applyEnemyFace!=='function'){
    window.applyEnemyFace=function(url){
      window.currentEnemyURL=url; window.enemyFaceURL=url;
      // DOMカード
      try{
        const f=(typeof ui!=='undefined'&&ui&&ui.ovFace)?ui.ovFace:document.getElementById('ovFace');
        if(f) f.style.backgroundImage=`url('${url}')`;
      }catch(_){}
      // 3Dスプライト
      try{
        if(typeof applyFaceSprite==='function') applyFaceSprite(url);
        else if(typeof setOpponentFace==='function') setOpponentFace(url);
      }catch(_){}
      // 位置更新（任意）
      try{ if(typeof updateOpponentFace==='function') updateOpponentFace(); }catch(_){}
    };
  }

  // 2) 練習中フェイスロック（他所の上書きを定期的に復帰）
  if(typeof window.__practiceFaceLockStart!=='function'){
    let __faceLockTimer=null, __faceWant=null;
    window.__practiceFaceLockStart=function(url){
      __faceWant=url; window.__practiceFaceLockStop?.(); applyEnemyFace(__faceWant);
      __faceLockTimer=setInterval(function(){
        if(!(window.game&&game.mode==='practice')) return;
        if(window.currentEnemyURL!==__faceWant) applyEnemyFace(__faceWant);
      },1000);
    };
    window.__practiceFaceLockStop=function(){
      if(__faceLockTimer){ clearInterval(__faceLockTimer); __faceLockTimer=null; }
    };
    // タブ不可視→ロック停止、復帰時に再開（無駄タイマー防止）
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) window.__practiceFaceLockStop?.();
      else if(window.game&&game.mode==='practice'&&__faceWant) window.__practiceFaceLockStart?.(__faceWant);
    });
  }

  // 3) ランダムヒント（存在しなければ定義）
  if(typeof window.__practiceHintStart!=='function'||typeof window.__practiceHintStop!=='function'){
    const HINTS = [
      'てびょうしのあいだに てをきめよう',
      '⚡をためよう',
      '💥は🛡️をこわせるよ',
      '⚡️がたりないと うごけないよ',
      '🛡️は☄️をふせぐよ',
      '🔄はこうげきをはねかえすよ'
    ];
    const TICK_MS=2000, PROB=0.40, MIN_GAP_MS=6000, SHOW_MS=3500;
    let timer=null,lastShownAt=0,lastIdx=-1;
    function pick(){ let i=(Math.random()*HINTS.length)|0; if(i===lastIdx) i=(i+1)%HINTS.length; lastIdx=i; return HINTS[i]; }
    function tick(){
      const g=window.game; if(!(g&&g.mode==='practice')) return;
      const now=performance.now(); if(now-lastShownAt<MIN_GAP_MS) return;
      if(Math.random()>PROB) return;
      try{ showBanner(pick(),SHOW_MS); lastShownAt=now; }catch(_){}
    }
    window.__practiceHintStart=function(){ window.__practiceHintStop?.(); timer=setInterval(tick,TICK_MS); };
    window.__practiceHintStop=function(){ if(timer){ clearInterval(timer); timer=null; } };
  }
})();

// 便利関数（開始/停止時の漏れ掃除）
function _readBpm(){
  var bpmVal=parseInt((ui.bpm&&ui.bpm.value)?ui.bpm.value:'100',10);
  return clampNumber(isFinite(bpmVal)?bpmVal:100,50,150);
}
function _disposeAllEffects(){
  try{
    if(typeof EFFECTS!=='undefined'){
      Array.from(EFFECTS).forEach(e=>{ try{ e.dispose?.(); }catch(_){} });
    }
  }catch(_){}
}
function _clearAllTimers(){
  try{ clearTimers?.('player'); clearTimers?.('opponent'); }catch(_){}
}

function startPracticeMode(){
  // 既存ループ/効果/タイマーの停止と掃除
  if(window.game){ window.game.running=false; stopBeatConductor(); }
  try{ const pb=document.getElementById('practiceBadge'); if(pb) pb.remove(); }catch(_){}
  _clearAllTimers(); _disposeAllEffects();

  var bpm=_readBpm();
  game={
    running:true, turn:1,
    bpm:bpm, beatMs:60000/bpm,
    eP:0, eO:0,
    histP:[], histO:[],
    inputOpen:false, pendingRes:null,
    baseStartMs:performance.now(), lastBeatIdx:-1, turnStartMs:0,
    piercedThisTurn:false,
    kills:0, level:1,
    aiCD:{R:0,S:0},
    mode:'practice',
    postImpactHold:null, impactHoldUntilMs:0
  };
  window.game=game;
  window.DreamcoreBgmCue?.("practice");

  // 練習用顔：即時適用＋ロック
  var PRACTICE_FACE='./assets/opponent-6.svg';
  applyEnemyFace(PRACTICE_FACE);
  window.__practiceFaceLockStart?.(PRACTICE_FACE);

  updateBars();
  if(ui&&ui.ov) ui.ov.classList.remove('show');
  if(typeof setSwipeEnabled==='function') setSwipeEnabled(true);

  // リズムは現状維持（外部のonBeatなど既存ロジックに委ねる）
  startBeatConductor();

  // ヒント開始
  window.__practiceHintStart?.();

  if(typeof window.updateModeToggleUI==='function') window.updateModeToggleUI();
}

function startBattleMode(){
  if(window.game){ window.game.running=false; stopBeatConductor(); }
  try{ const pb=document.getElementById('practiceBadge'); if(pb) pb.remove(); }catch(_){}
  _clearAllTimers(); _disposeAllEffects();

  var bpm=_readBpm();
  game={
    running:false, turn:1,
    bpm:bpm, beatMs:60000/bpm,
    eP:0, eO:0,
    histP:[], histO:[],
    inputOpen:false, pendingRes:null,
    baseStartMs:0, lastBeatIdx:-1, turnStartMs:0,
    piercedThisTurn:false,
    kills:0, level:1,
    aiCD:{R:0,S:0},
    mode:'battle',
    postImpactHold:null, impactHoldUntilMs:0
  };
  window.game=game;
  window.DreamcoreBgmCue?.("level1");

  updateBars();
  if(typeof refillEnemyDeck==='function') refillEnemyDeck();
  if(typeof nextEnemy==='function') nextEnemy();
  if(ui&&ui.lockMsg) ui.lockMsg.textContent='（対戦相手登場…）';
  if(ui&&ui.ov) ui.ov.classList.remove('show');

  // 練習専用挙動を停止
  window.__practiceHintStop?.();
  window.__practiceFaceLockStop?.();

  showOverlayIntro();
  if(typeof window.updateModeToggleUI==='function') window.updateModeToggleUI();
}

function stopGame(){
  if(!window.game) return;
  window.DreamcoreBgmStop?.();
  window.game.running=false;
  stopBeatConductor();
  if(typeof setSwipeEnabled==='function') setSwipeEnabled(false);
  if(ui.lockMsg) ui.lockMsg.textContent='（停止）';
  try{ const pb=document.getElementById('practiceBadge'); if(pb) pb.remove(); }catch(_){}
  _clearAllTimers(); _disposeAllEffects();

  // 練習専用の動作を停止
  window.__practiceHintStop?.();
  window.__practiceFaceLockStop?.();

  // 保持中のホールド待ちを解除
  game.postImpactHold=null; game.impactHoldUntilMs=0;
}

// 既存 API 互換
function startGame(){ startBattleMode(); }

// 単一トグル（左上）— 既存ボタンをクローン置換（多重ハンドラ防止）
(function(){
  const btn=document.getElementById('gameStart'); if(!btn) return;
  const clone=btn.cloneNode(true); btn.replaceWith(clone);

  // 練習中ラベル（UIは現状同等の見た目）
  const label=document.createElement('span');
  label.id='modeLabel';
  label.textContent='練習モード';
  label.style.display='none';
  label.style.marginRight='8px';
  label.style.fontSize='14px';
  label.style.fontWeight='600';
  label.style.verticalAlign='middle';
  clone.parentNode.insertBefore(label,clone);

  function styleButton(el,theme){
    el.style.color='#fff';
    if(theme==='red'){ el.style.background='#e74c3c'; el.style.borderColor='#c0392b'; }
    else{ el.style.background='#2ecc71'; el.style.borderColor='#27ae60'; }
  }
  function updateModeToggleUI(){
    const g=window.game;
    if(!g||g.mode==='practice'){
      clone.textContent='対戦モードへ'; styleButton(clone,'red'); label.style.display='';
    }else{
      clone.textContent='練習モードへ'; styleButton(clone,'green'); label.style.display='none';
    }
    clone.setAttribute('aria-label','モード切替');
  }
  window.updateModeToggleUI=updateModeToggleUI;

  clone.addEventListener('click',function(){
    const g=window.game;
    if(!g||g.mode==='practice') startBattleMode();
    else startPracticeMode();
  });

  updateModeToggleUI();
})();

// 起動時：練習モードで即スタート（多重起動防止）
(function(){
  const boot=()=>startPracticeMode();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
//#endregion start-stop

/* =========================================================
 *  RENDER LOOP（ドリフト防止・多重更新防止）
 * =======================================================*/
//#region render-loop
var _last=performance.now();
function animate(){
  var now=performance.now(), dt=Math.min(0.05,(now-_last)/1000); _last=now;

  try{ tickSequenceSide('player',dt); tickSequenceSide('opponent',dt); }catch(_){}
  try{
    if(typeof EFFECTS!=='undefined'){
      var arr=Array.from(EFFECTS);
      for(var i=0;i<arr.length;i++){
        var e=arr[i];
        if(!e.update(dt)){
          try{ e.dispose&&e.dispose(); }catch(_){}
        }
      }
    }
  }catch(_){}
  try{ handleCollisions(dt); }catch(_){}
  try{ updateShake(dt); }catch(_){}
  try{
    handL.update&&handL.update(dt);
    handR.update&&handR.update(dt);
    handOL.update&&handOL.update(dt);
    handOR.update&&handOR.update(dt);
  }catch(_){}
  try{ controls&&controls.update&&controls.update(); }catch(_){}
  try{ renderer&&scene&&camera&&renderer.render(scene,camera); }catch(_){}
  requestAnimationFrame(animate);
  try{ updateOpponentFace&&updateOpponentFace(); }catch(_){}
}
animate();

// リサイズの冗長保護
addEventListener('resize',function(){
  try{
    if(renderer&&camera){
      renderer.setSize(innerWidth,innerHeight);
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix&&camera.updateProjectionMatrix();
    }
  }catch(_){}
});
//#endregion render-loop


</script>
